<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>SquirrelSplit — AGD House</title>
  <meta name="theme-color" content="#A6192E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SquirrelSplit" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Register the service worker for offline support + update notifications
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  </script>
</head>
<body>
  <!-- Login gate -->
  <div id="gate" class="gate">
    <div class="box">
      <div class="mascot">🐿️</div>
      <h1>SquirrelSplit</h1>
      <p>Where Unit 5303 stashes its acorns 🌰<br>221 Armstrong St · War Eagle 🦅</p>
      <form id="loginForm">
        <div class="field">
          <label for="pw">House password</label>
          <input id="pw" type="password" autocomplete="current-password" placeholder="Enter the house password" />
        </div>
        <div class="err" id="loginErr"></div>
        <button class="btn primary" type="submit">Let me in 🌰</button>
      </form>
      <div class="hint" id="gateHint"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app hidden">
    <div class="topbar">
      <span class="logo">🐿️</span>
      <h1 id="houseName">AGD House</h1>
      <button class="iconbtn" id="switchBtn" title="Switch person">↩️</button>
      <button class="iconbtn hidden" id="settingsBtn" title="Settings">⚙️</button>
    </div>
    <div id="main"></div>
  </div>

  <!-- Modal mount point -->
  <div id="modal"></div>

  <!-- "App updated" banner (shown when a new version is ready) -->
  <div id="update-banner">✨ SquirrelSplit was updated — tap to refresh 🐿️</div>

  <script src="confetti.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Surface a tap-to-install banner when a new version has downloaded.
    // A new release is detected whenever sw.js's CACHE_NAME changes on deploy.
    if ('serviceWorker' in navigator) {
      var userRequestedUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (userRequestedUpdate) location.reload();
      });
      navigator.serviceWorker.ready.then(function (reg) {
        var banner = document.getElementById('update-banner');
        function offerUpdate(sw) {
          banner.classList.add('show');
          banner.onclick = function () {
            userRequestedUpdate = true;
            banner.classList.remove('show');
            sw.postMessage('SKIP_WAITING');
          };
        }
        if (reg.waiting) offerUpdate(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(sw);
          });
        });
        // Home-screen apps stay resident for days — re-check on each foreground.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update().catch(function () {});
        });
        reg.update().catch(function () {});
      });
    }
  </script>
</body>
</html>
