<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>SquirrelSplit — AGD House</title>
  <meta name="theme-color" content="#A6192E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SquirrelSplit" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login gate -->
  <div id="gate" class="gate">
    <div class="box">
      <div class="mascot">🐿️</div>
      <h1>SquirrelSplit</h1>
      <p>Where Unit 5303 stashes its acorns 🌰<br>221 Armstrong St · War Eagle 🦅</p>
      <form id="loginForm">
        <div class="field">
          <label for="pw">House password</label>
          <input id="pw" type="password" autocomplete="current-password" placeholder="Enter the house password" />
        </div>
        <div class="err" id="loginErr"></div>
        <button class="btn primary" type="submit">Let me in 🌰</button>
      </form>
      <div class="hint" id="gateHint"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" class="app hidden">
    <div class="topbar">
      <span class="logo">🐿️</span>
      <h1 id="houseName">AGD House</h1>
      <button class="iconbtn" id="switchBtn" title="Switch person">🔄</button>
      <button class="iconbtn hidden" id="settingsBtn" title="Settings">⚙️</button>
    </div>
    <div id="main"></div>
  </div>

  <!-- Modal mount point -->
  <div id="modal"></div>

  <script src="confetti.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
